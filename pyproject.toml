[project]
name = "uad-console-mcp"
version = "0.1.0"
description = "Unofficial MCP server for controlling Universal Audio Apollo interfaces (UAD Console) via the UA Mixer Engine's local TCP API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Phil Woolley" }]
keywords = ["mcp", "universal-audio", "apollo", "uad", "audio", "console", "mixer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Repository = "https://github.com/fomoPhil/uad-console-mcp"

[project.scripts]
uad-console-mcp = "uad_console_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uad_console_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: requires a real UA Mixer Engine + Apollo attached (never run in CI)",
  "slow: long-running soak tests",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
